<button class="chat-floating-btn" (click)="toggleChat()" title="Fale com a Iris">
  <div class="assistant-branding">
    <img src="/images/Iris.png" alt="Iris" class="assistant-avatar" />
    <span class="assistant-label">Fale com a Iris</span>
  </div>
</button>

<div class="chat-window" [class.open]="isChatOpen()">
  <div class="chat-header">
    <div class="chat-header-title">
      <div class="assistant-branding-header">
        <img src="/images/Iris.png" alt="Iris" class="assistant-avatar-small" />
        <h5>Iris</h5>
      </div>
      <div class="header-actions">
        <span class="online-indicator"></span>
        <span class="online-text">
          Online
        </span>
      </div>
    </div>
  </div>

  <div class="chat-body">
    <div class="messages-container">
      @for (msg of messages(); track $index) {
        <div class="message-row" [class.user-row]="msg.isUser" [class.iris-row]="!msg.isUser">
          @if (!msg.isUser) {
            <img src="/images/Iris.png" class="chat-msg-avatar" alt="Iris" />
          }
          <div class="message-bubble">
            @if (msg.isUser) {
              {{ msg.text }}
            } @else {
              <markdown [data]="msg.text" />
            }
          </div>
        </div>
      }

      @if (isTyping()) {
        <div class="message-row iris-row">
          <img src="/images/Iris.png" class="chat-msg-avatar" alt="Iris" />
          <div class="message-bubble typing-bubble">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      }

      <div #messagesEnd></div>
    </div>
  </div>

  <div class="chat-footer-container">
    <div class="chat-footer">
      <input
        type="text"
        placeholder="Pergunte sobre o currículo do Itamar..."
        [value]="userInput()"
        (input)="onInput($event)"
        (keydown.enter)="sendMessage()"
        maxlength="100"
        [disabled]="isTyping()"
      />
      <button (click)="sendMessage()" [disabled]="!userInput().trim() || isTyping()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="char-counter" [class.counter-warn]="userInput().length >= 90">
      {{ userInput().length }} / 100
    </div>
  </div>
</div>
